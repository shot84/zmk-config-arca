# ZMK (cormoran/zmk main+dya, Zephyr 4.1) and modules, pinned to the commits used for the released firmware.
# Zephyr is pinned to its upstream base; patches/zephyr-arca.patch is applied on top (.github/workflows/build.yml).
manifest:
  version: 1.2
  defaults:
    remote: cormoran
    revision: main
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    # Prospector を**表示専用のBLEスキャナ**として使うためのフォーク（t-ogura）。
    # 本家 carrefinho はドングル=central前提だが、こちらは Scanner Mode を持つ
    # ＝ Arca は自分の central のまま、状態をアドバタイズするだけ
    - name: prospector
      url-base: https://github.com/t-ogura
  projects:
    - name: zmk-west-commands
      revision: 536260056f362edb2092905f2a75317bc8cb9bc2
      import: true
    - name: zmk
      revision: e5c9b6915b56801193e359dd9bad4a167ce0d1b8
      import:
        file: app/west.yml
      clone-depth: 1
    - name: zephyr
      revision: 7c6b4cc486ecb41a68d9c2b1def2bb3178fbb826
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_silabs
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
    # ---- Arca: センサは PAW3222（DYA Dash の PMW3610 は入れない） ----
    # ---- Arca rev.2（v5・シールド arca_v5）: センサは PMW3610 ----
    #   ★2026-10-28: DYA Dash と同じドライバ（DT の compatible は "cormoran,pmw3610"）。
    #   cpi・軸・force-awake を DYA で実行時に変えられる。rev3（ark）は DT に無いので無効のまま。
    #   ★作者の注記「動作検証中」＝main 生追従はやめて固定（ZMK e5c9b69・custom-settings c6a7fef と同時期）
    - name: zmk-driver-pmw3610-with-custom-studio-rpc
      revision: 5c34ea0eec246a1c986111417cd779b53144629a
