# Arca rev.2（v5）右手（peripheral）/ 2026-10-28
# ★rev3（ark_right.conf）の対策を理由ごと引き継ぐ。外したのは LCD・ENC・SK6812 だけ。

# NFC1＝MOTION・NFC2＝線 6（必須）
CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_ZMK_BATTERY_REPORTING=y

# ── OLED（SSD1306 128×32・I2C1）＝自前の縦の画面（zmk-module-arca-oled・台帳 11-02）
CONFIG_ZMK_DISPLAY=y
CONFIG_ARCA_OLED=y

# ── トラボ PMW3610
CONFIG_PMW3610=y
# ★R は L と同じセンサ基板を 180° 回して付ける（台帳 10-19「R は土台ごと 180° 回す（FW で X/Y 反転）」）
#   ＝L の軸の X/Y を両方反転。L の向きを実機で直したら、ここも同じだけ変える（DYA で直すなら左右それぞれ）
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_Y=y
# DYA の設定を R のセンサへ中継（L と両方に要る）
# 11-02 報告の間隔（動きは足し込んで間隔ごとに送る）＝SparAkasha（MKB_R_TB・使用頻度が一番多い）と同じ 10（MeKaBu2 は 14）。DYA で保存した値があればそちらが勝つ
# 11-10: 報告間隔 14（MeKaBu2 と同じ）
CONFIG_PMW3610_REPORT_INTERVAL_MIN=14
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_PMW3610_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# ── 状態 LED = XIAO 内蔵の RGB
CONFIG_ARCA_LED_WIDGET=y
# 左右の conf を同じ形に保つため（右にはレイヤが無い＝モジュールが畳む・ark_right.conf の注記）
CONFIG_ARCA_LED_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_ARCA_LED_WIDGET_LAYER_COLOR=6
CONFIG_ARCA_LED_WIDGET_LAYER_BLINK_MS=100

# central の設定変更を受ける relay（Studio 本体は central のみ）
CONFIG_ZMK_SETTINGS_RPC=y

# マトリクス診断（右は答えるだけ）
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=50

CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y

# リレーの上限（central と同値）
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
# watchdog / PMW3610 の relay 応答は低優先キューで nanopb を回す（rev3 09-04 は 2048・PMW3610 の注記は 4096）
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096

# ══════════════════════════════════════════════════════════════════════
# rev3 で実機で踏んだ物（理由は ark_right.conf）
# ══════════════════════════════════════════════════════════════════════
CONFIG_INPUT_THREAD_STACK_SIZE=3072
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 11-15: 画面を専用の列で描く（システムの列だと OLED を描く間、センサの読み出しが待たされる）
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
