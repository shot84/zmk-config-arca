# Arca rev.2（v5）左手（central）/ 2026-10-28
# ★rev3（ark_left.conf）で実機で踏んで入れた対策は**理由ごと引き継ぐ**（同じ XIAO・同じ ZMK/DYA・同じ BLE 構成）。
#   外したのは部品ごと無い物だけ: LCD（ls0xx・arca-lcd）・ENC（EC11・sensor-rotate）・SK6812（LED_STRIP）。
#   各行の経緯は ark_left.conf のコメントが正。

# NFC1/NFC2（P0.09/P0.10）＝MOTION / CS（台帳 E3＝MeKaBu と同じ）。無いと NFC の端子のまま（必須）
CONFIG_NFCT_PINS_AS_GPIOS=y

# DYA/ZMK Studio（central のみ・USB。build.sh が -S studio-rpc-usb-uart を付ける）
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_BAS=y

# ── OLED（SSD1306 128×32・I2C1）＝自前の縦の画面（zmk-module-arca-oled・台帳 11-02）
CONFIG_ZMK_DISPLAY=y
CONFIG_ARCA_OLED=y
# Jump レイヤの番号＝arca_v5.keymap の #define JUMP（11-09・R の円の中を J に・ark_fw_v5_check.py が照合）
CONFIG_ARCA_OLED_JUMP_LAYER=5

# ── トラボ PMW3610（cormoran ドライバ）
CONFIG_PMW3610=y
# 軸の初期値（L）。★向きは実機で決める＝**DYA の PMW3610 の設定で直す**（焼き直し不要）。
#   R は L を 180° 回した物＝arca_v5_right.conf で X/Y 両反転（ここを変えたら R も同じだけ変える）
# DYA で cpi・軸・force-awake・休止の時間を実行時に変える（左右のセンサを settings-id で別々に覚える）
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
# 11-02 報告の間隔（動きは足し込んで間隔ごとに送る）＝SparAkasha（MKB_R_TB・使用頻度が一番多い）と同じ 10（MeKaBu2 は 14）。DYA で保存した値があればそちらが勝つ
CONFIG_PMW3610_REPORT_INTERVAL_MIN=10
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# PMW3610 の画像取得（フレーム）の 1 片が Studio の送信バッファに収まる大きさ（ドライバの BUILD_ASSERT・例の値）
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
# R のセンサ（peripheral）にも DYA から届くように（両半分に要る）
CONFIG_ZMK_PMW3610_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# ── 状態 LED = XIAO 内蔵の RGB（台帳 E4）。zmk-module-arca-led の GPIO 出力
#   ★GPIO は点く/消えるだけ＝明るさと充電の残量グラデは出ない（最寄りの 8 色）
CONFIG_ARCA_LED_WIDGET=y
# レイヤを常時色で（rev3 09-02 のユーザー指示「各レイヤーで色変えたい・おすすめで」と同じ割り当て）
#   色コード: 0=黒 1=赤 2=緑 3=黄 4=青 5=マゼンタ 6=シアン 7=白
CONFIG_ARCA_LED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_ARCA_LED_WIDGET_LAYER_0_COLOR=0
CONFIG_ARCA_LED_WIDGET_LAYER_1_COLOR=5
CONFIG_ARCA_LED_WIDGET_LAYER_2_COLOR=2
CONFIG_ARCA_LED_WIDGET_LAYER_3_COLOR=6
CONFIG_ARCA_LED_WIDGET_LAYER_4_COLOR=4

# ══════════════════════════════════════════════════════════════════════
# DYA（cormoran fork）の機能群（ark_left.conf と同じ）
# ══════════════════════════════════════════════════════════════════════
# runtime-input-processor の必須要件（足りないと Refresh List の初回で落ちる）。
#   ★PMW3610 の relay も低優先キューで nanopb を回す（ドライバの注記: 2048 では溢れた）＝4096
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# マトリクス診断（初組立のはんだ検証）。SPLIT＝右も読む（右にも同じモジュール）
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=50
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
CONFIG_ZMK_BATTERY_HISTORY_INTERVAL_MINUTES=60
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=4
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_SETTING_EXPOSE=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
# 11-10 固まり（sysworkq）の現場の控え（firmware/zmk-module-arca-frz・2 秒で控え戻ったら設定 arca_frz/N へ）は**外した**（ユーザー「デメリットはない？ちょっと懐疑的になってきてる」→「なら、一旦なしでいいや」）。使うなら CONFIG_ARCA_FRZ=y と CONFIG_ARCA_FRZ_STALL_MS=2000

# リレーの1件の上限（kscan 診断 256・PMW3610 の GetInfo 約 231）＝**両半分に同じ値**
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
# runtime-macro の上限 clamp（警告＝Kconfig エラー）
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
# Prospector の放送は rev3 で切ったまま（31 バイト超で失敗し続けていた）
CONFIG_ZMK_STATUS_ADVERTISEMENT=n

# ══════════════════════════════════════════════════════════════════════
# rev3 で実機で踏んだ物（理由は ark_left.conf）
# ══════════════════════════════════════════════════════════════════════
CONFIG_INPUT_THREAD_STACK_SIZE=3072
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
# 11-15: MeKaBu2 と同じ 20（ZMK 既定）に戻した
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=20
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
# ディープスリープ 15 分・キー（kscan の wakeup-source・INTR）で起きる
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# NVS の索引（L は DYA の設定と電池履歴を全部持つ＝起動が遅くなる対策・10-16）
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_NVS_LOOKUP_CACHE_SIZE=2048

# 11-15: 画面を専用の列で描く（システムの列だと OLED を描く間、R から届いた動きの受け取りが止まる）
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
